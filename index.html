<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Julenatten da gaven forsvant</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0e1a36;--sky2:#2a4470;--glow:#ffc46b;--ink:#f7ecd8;--berry:#e0525e;--pine:#5bb08a;--panel:rgba(14,26,54,.8);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--sky1)}
body{margin:0;min-height:100%;font-family:Nunito,"Trebuchet MS",sans-serif;font-size:19px;line-height:1.6;color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(255,196,107,.28),transparent 70%),linear-gradient(var(--sky1),var(--sky2))}
#snow{position:fixed;inset:0;pointer-events:none;z-index:5}
#scene{position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.win{animation:flick 5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.78}}
#lights{position:fixed;top:0;left:0;right:0;height:34px;z-index:4;pointer-events:none;display:flex;justify-content:space-around;padding-top:env(safe-area-inset-top,0px)}
#lights i{width:9px;height:12px;border-radius:50%;margin-top:6px;animation:tw 3s ease-in-out infinite;box-shadow:0 0 12px 3px currentColor;background:currentColor}
@keyframes tw{0%,100%{opacity:.95}50%{opacity:.5}}
main{position:relative;z-index:2;max-width:660px;margin:0 auto;padding:52px 18px 30vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:2.3rem;text-align:center}
h2{font-size:1.6rem}
#stars{text-align:center;font-size:1.5rem;letter-spacing:.15em;color:rgba(255,255,255,.25);margin-bottom:8px}
#stars .on{color:var(--glow);text-shadow:0 0 12px var(--glow)}
#stage{background:var(--panel);border:1px solid rgba(255,196,107,.45);border-radius:22px;padding:24px 24px 28px;box-shadow:0 0 44px rgba(255,196,107,.16)}
p{margin:.6em 0}
.say{display:flex;gap:14px;align-items:flex-start;margin:16px 0}
.pup{flex:0 0 74px}.pup svg{width:74px;height:74px}
.bubble{background:rgba(255,196,107,.14);border-radius:18px 18px 18px 4px;padding:10px 16px}
.note{background:#fff3d6;color:#3b2a14;border-radius:6px;padding:16px 20px;margin:16px 0;transform:rotate(-.6deg);font-size:1.05rem}
input,textarea{width:100%;font:inherit;color:#1d2540;background:#fff8ea;border:2px solid transparent;border-radius:12px;padding:10px 14px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
textarea{min-height:150px;resize:vertical}
button{font:inherit;font-weight:700;color:#3b1a0c;background:var(--glow);border:0;border-radius:999px;padding:10px 24px;cursor:pointer;box-shadow:0 0 18px rgba(255,196,107,.4)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid rgba(247,236,216,.4);padding:6px 16px;font-size:.9rem}
.row{display:flex;gap:10px;margin:12px 0}.row input{flex:1}
.fb{min-height:1.6em;color:#ffd9a0}
.win-t{color:var(--pine);font-weight:700}
.tgt{font-size:1.25rem;line-height:1.9;background:rgba(0,0,0,.25);border-radius:12px;padding:12px 16px;margin:12px 0;font-family:"Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.tgt .ok{color:var(--pine)}.tgt .bad{color:#fff;background:var(--berry);border-radius:3px}.tgt .pend{opacity:.6}
.poem{font-family:Fraunces,Georgia,serif;font-size:1.3rem;text-align:center;margin:18px 0;line-height:1.8}
.ask{padding-left:1.2em}.ask li{margin:.2em 0}
.xmas{background:#fffaf0;color:#2b1c10;border:4px solid var(--berry);border-radius:14px;padding:22px 26px;margin:18px 0}
.xmas h3{color:var(--berry);font-size:1.7rem;margin-top:0}
.small{font-size:.9rem;opacity:.8}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){.win,#lights i{animation:none}}
@media print{@page{margin:18mm;@bottom-center{content:counter(page)}@top-center{content:""}}
html,body{background:#fff}body::before{display:none}body *{visibility:hidden}#cardOut,#cardOut *{visibility:visible}#cardOut{position:absolute;left:0;top:0;width:100%;border-width:3px}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="lights"></div>
<div id="scene" aria-hidden="true"><svg viewBox="0 0 800 200" preserveAspectRatio="none">
<polygon points="0,200 0,120 120,50 230,115 340,30 470,120 580,60 700,110 800,70 800,200" fill="#16264a"/>
<polygon points="0,200 0,160 150,110 300,155 450,100 620,150 800,115 800,200" fill="#0d1a38"/>
<g transform="translate(600,118)"><rect x="0" y="22" width="70" height="46" fill="#a2402f"/><polygon points="-6,24 35,-6 76,24" fill="#f4f6fb"/><rect class="win" x="12" y="36" width="16" height="16" fill="#ffc46b"/><rect class="win" x="42" y="36" width="16" height="16" fill="#ffc46b"/></g>
<rect x="0" y="186" width="800" height="14" fill="#f4f6fb"/></svg></div>
<main>
<div id="stars" aria-label="Julestjerner"></div>
<div id="stage"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-zæøå ]/g,' ').replace(/\s+/g,' ').trim();
let stars=0,name='',to='',msg='';
const PUP='<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="20" cy="50" rx="12" ry="24" fill="#c98a2b" transform="rotate(20 20 50)"/><ellipse cx="80" cy="50" rx="12" ry="24" fill="#c98a2b" transform="rotate(-20 80 50)"/><circle cx="50" cy="58" r="34" fill="#ffd04d"/><circle cx="38" cy="54" r="5" fill="#2b1b0e"/><circle cx="62" cy="54" r="5" fill="#2b1b0e"/><ellipse cx="50" cy="68" rx="8" ry="6" fill="#2b1b0e"/><path d="M42 78q8 8 16 0" stroke="#2b1b0e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22 34q28-40 56 0z" fill="#e0525e"/><rect x="20" y="30" width="60" height="9" rx="4" fill="#fff"/><circle cx="50" cy="12" r="7" fill="#fff"/></svg>';
const say=h=>'<div class="say"><div class="pup">'+PUP+'</div><div class="bubble">'+h+'</div></div>';
function drawStars(){$('#stars').innerHTML=[0,1,2,3,4,5].map(i=>'<span'+(i<stars?' class="on"':'')+'>★</span>').join('')}
function gain(){stars++;drawStars()}
const S=$('#stage');
function show(h){S.innerHTML=h;scrollTo({top:0,behavior:'smooth'})}

const steps=[intro,hello,snowRiddle,card,rost,lesHoyt,treRiddle,finale];
let cur=0;
function next(){cur++;steps[cur]()}

function intro(){
 show('<h1>Julenatten da gaven forsvant</h1>'+
 say('Voff! Det er snart jul, og jeg har gjort noe veldig dumt. Kan du hjelpe meg?')+
 ''+
 '<p class="center"><button id="go">Start julereisen</button></p>');
 $('#go').onclick=next;
}

function hello(){
 show('<h2>Dagen før julaften</h2>'+
 '<p>Det er kveld på Værøy. Snøen laver sakte ned utenfor vinduet, og lysene i stua lyser varmt og gult. Havet suser langt der nede, og fjellene står hvite og stille.</p>'+
 '<p>Inne ved døra sitter en liten gul valp. Det er Tassen. Han har en rød nisselue på hodet, men halen henger ned. Han ser veldig lei seg ut.</p>'+
 say('Å nei, å nei! Hvem er det som har kommet? Hva heter du?')+
 '<div class="row"><input id="nm" maxlength="30" autocomplete="off" placeholder="Skriv navnet ditt her"><button id="ok" disabled>Si hei</button></div><div id="out"></div>');
 const nm=$('#nm'),ok=$('#ok');
 nm.oninput=()=>ok.disabled=nm.value.trim().length<2;
 nm.onkeydown=e=>{if(e.key==='Enter'&&!ok.disabled)ok.click()};
 ok.onclick=()=>{
  name=nm.value.trim();name=name[0].toUpperCase()+name.slice(1);
  nm.disabled=ok.disabled=true;gain();
  $('#out').innerHTML=say('Hei, <b>'+esc(name)+'</b>! Så fint navn! Nå skal jeg fortelle deg hva som har skjedd. Jeg gjemte julegaven din et sted, så ingen skulle finne den. Men så blåste det opp, og jeg har glemt hvor den er!')+
  '<p class="center"><button id="nx">Fortell mer</button></p>';
  $('#nx').onclick=next;
 };
 nm.focus();
}

function riddle(o){
 show('<h2>'+o.title+'</h2>'+o.intro+'<div class="note">'+o.q+'</div>'+
 '<div class="row"><input id="ans" autocomplete="off" placeholder="Skriv svaret her"><button id="ok">Svar</button></div>'+
 '<p class="fb" id="fb"></p><p><button class="ghost" id="hint">Gi meg et hint</button></p><div id="out"></div>');
 const a=$('#ans'),fb=$('#fb');let tries=0;
 const check=()=>{
  const v=norm(a.value).split(' ');
  if(o.a.some(x=>v.includes(x))){
   a.disabled=$('#ok').disabled=$('#hint').disabled=true;gain();fb.innerHTML='<span class="win-t">Riktig! Så flink du er!</span>';
   $('#out').innerHTML=o.win+'<p class="center"><button id="nx">Videre</button></p>';$('#nx').onclick=next;
  }else{tries++;fb.textContent=tries>1?'Nesten! Prøv igjen. Du kan trykke på hintet hvis du vil.':'Hmm, ikke helt. Les gåten en gang til.'}
 };
 $('#ok').onclick=check;a.onkeydown=e=>{if(e.key==='Enter')check()};
 $('#hint').onclick=()=>fb.textContent='Hint: '+o.hint;
 a.focus();
}

function snowRiddle(){
 riddle({title:'Nissebrevet',
 intro:'<p>Plutselig hører dere en liten lyd ved vinduet. Det ligger en krøllete lapp på vindusbrettet! Den lukter pepperkaker. Tassen logrer av glede.</p>',
 q:'<p><b>Kjære '+esc(name)+',</b><br>Gaven din er trygg, det lover jeg. Men du må finne den selv. Her er det første sporet mitt:</p><p><i>Jeg er hvit og myk og kald.<br>Jeg faller stille fra himmelen om vinteren.<br>Du kan lage en mann av meg.<br>Hva er jeg?</i></p><p>Hilsen Julenissen</p>',
 a:['snø','snøen','snøflak','snøfnugg','snømann'],hint:'Se ut av vinduet. Hva faller ned nå?',
 win:say('Snø! Selvfølgelig! Nå husker jeg det! Jeg gjemte pakken ute i snøen, men så blåste det opp. Oi! Jeg tror kanskje pakken har blåst helt bort til Røst!')+say('Det skjer jo stadig vekk at ting fra Værøy havner på Røst. Vi må ta ferga dit sammen og lete!')});
}

function card(){
 show('<h2>Julekort til familien</h2>'+
 say('Før vi reiser, må vi sende et julekort. Familien din skal vite at du tenker på dem. Kan du skrive et kort fra deg?')+
 '<p>Skriv noe fint til hele familien. Tassen har tre spørsmål som kan hjelpe deg i gang:</p>'+
 '<ul class="ask"><li>Hva har vært best i år?</li><li>Hva gleder du deg til i jula?</li><li>Hva vil du ønske familien din?</li></ul>'+
 '<p><label for="to">Kortet er til:</label><input id="to" maxlength="60" placeholder="For eksempel: Mamma, pappa og alle hjemme"></p>'+
 '<p><label for="tx">Skriv hilsenen din:</label><textarea id="tx" placeholder="Kjære familie …"></textarea></p>'+
 '<p class="small" id="cnt"></p><p class="center"><button id="ok" disabled>Send julekortet</button></p><div id="out"></div>');
 const to_=$('#to'),tx=$('#tx'),ok=$('#ok');
 const up=()=>{const n=tx.value.trim().length;$('#cnt').textContent=n<40?'Skriv litt mer, minst en kort setning eller to.':'Det ser fint ut!';ok.disabled=n<40||to_.value.trim().length<2};
 to_.oninput=tx.oninput=up;up();
 ok.onclick=()=>{to=to_.value.trim();msg=tx.value.trim();to_.disabled=tx.disabled=ok.disabled=true;gain();
  $('#out').innerHTML=say('Wow, for et fint kort! Jeg ble helt varm i halen. Det blir med posten i dag. Nå må vi videre, for ferga til Røst går snart!')+'<p class="center"><button id="nx">Ta ferga til Røst</button></p>';$('#nx').onclick=next};
}

function rost(){
 const T='Pakken til '+name+' var på Røst, men har reist hjem igjen. God jul fra Røst! Hilsen Tassen.';
 show('<h2>Postkontoret på Røst</h2>'+
 '<p>Ferga duver rolig over havet og legger til kai på Røst. Her er det flatt som en pannekake, og tusenvis av fugler flyr over hustakene. Det lukter tørrfisk og nystekte vafler, og alle husene har julelys i vinduene.</p>'+
 '<p>På postkontoret står postmann Pelle med en stor sekk. Han smiler til Tassen.</p>'+
 '<p><b>Pelle:</b> «Å, leter du etter en pakke fra Værøy? Det skjer hele tiden! Den lå her i morges, men nå har den tatt ferga tilbake. Jeg må bare føre det inn i loggboka. Kan du skrive av dette for meg?»</p>'+
 '<div class="tgt" id="tgt"></div><input id="ty" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv av teksten her"><p class="fb" id="fb"></p><div id="out"></div>');
 const ty=$('#ty');
 const draw=()=>{const v=ty.value;let h='';for(let i=0;i<T.length;i++){const c=esc(T[i]);h+=i>=v.length?'<span class="pend">'+c+'</span>':v[i]===T[i]?'<span class="ok">'+c+'</span>':'<span class="bad">'+c+'</span>'}$('#tgt').innerHTML=h};
 draw();
 ty.oninput=()=>{draw();if(ty.value.trim()===T){ty.disabled=true;gain();$('#fb').innerHTML='<span class="win-t">Helt riktig! Flott skriving!</span>';
  $('#out').innerHTML='<p><b>Pelle:</b> «Tusen takk! Du skriver kjempefort. Pakken har allerede tatt ferga tilbake til Værøy.»</p>'+say('Ha ha, så den ville ikke bli på Røst! Kom, vi tar ferga hjem og ser om den har kommet fram.')+'<p class="center"><button id="nx">Ta ferga hjem</button></p>';$('#nx').onclick=next}};
 ty.focus();
}

function lesHoyt(){
 show('<h2>Stormen over havet</h2>'+
 '<p>På vei hjem med ferga blåser det opp. Bølgene løfter og senker skroget, og Tassen kryper helt inntil deg. Han er veldig redd for været.</p>'+
 say('Jeg tør ikke! Kan du lese noe høyt for meg? Da blir jeg rolig.')+
 '<div class="poem">Snøen daler stille ned,<br>Tassen vil nå sove fred.<br>Stjernene blinker, havet er blått,<br>snart er det jul, og alt er godt.</div>'+
 '<p class="small center">Les verset høyt, sakte og rolig. Gjerne to ganger.</p>'+
 '<p class="center"><button id="ok">Jeg har lest høyt</button></p><div id="out"></div>');
 const done=()=>{$('#ok').disabled=true;gain();
  $('#out').innerHTML=say('Åh, nå er jeg helt rolig. Stemmen din er så god å høre på. Tusen takk!')+'<p class="center"><button id="nx">Ferga legger til på Værøy</button></p>';$('#nx').onclick=next};
 $('#ok').onclick=done;
}

function treRiddle(){
 riddle({title:'Den siste gåten',
 intro:'<p>Ferga legger til kai på Værøy. Det er stille, og snøen lyser blått i mørket. Dere går hjem sammen, og Tassen skynder seg forbi alle snøhaugene. Så stopper han ved døra. Det henger en lapp på den!</p>'+say('Se! En lapp fra postbudet! Kan du lese den høyt for meg og løse gåten?'),
 q:'<p><b>Hei, '+esc(name)+'!</b><br>Pakken din ble feilsendt til Røst. Det skjer jo av og til. Men nå er den kommet rett! Som ekstra service har postbudet lagt den på rett plass. Hvor? Løs gåten:</p><p><i>Jeg er grønn hele året.<br>Om julen har jeg lys og kuler på meg.<br>Det er en stjerne øverst på toppen min.<br>Under meg ligger alle gavene.<br>Hva er jeg?</i></p><p>Hilsen postbudet</p>',
 a:['juletre','juletreet','tre','treet','gran','granen','grantre'],hint:'Det står inne i stua og lukter skog.',
 win:say('Juletreet! Selvfølgelig! Kom, vi løper inn i stua!')});
}

function finale(){
 show('<h2>Julaften</h2>'+
 '<p>I stua står juletreet og glitrer. Lysene blinker, og det knitrer i peisen. Og der, helt nederst under de grønne grenene, ligger en stor pakke med rød sløyfe.</p>'+
 '<p>På pakken står det: <b>«Til '+esc(name)+' og Tassen».</b></p>'+
 '<p>Dere åpner den sammen. Inni ligger en splitter ny, rød slede med plass til to! For en fin gave! Julenissen må ha vært klar over at dere er gode venner.</p>'+
 say('Voff voff! Takk for at du hjalp meg, '+esc(name)+'. Du er den snilleste jeg kjenner. Nå skal vi kjøre slede i morgen!')+
 '<h2 class="center">'+esc(name)+' den snille</h2><p class="center">Du fikk alle <b>6 julestjerner</b> og reddet julen. Gratulerer!</p>'+
 '<p>Her er julekortet du skrev:</p>'+
 '<div class="xmas" id="cardOut"><h3>God jul!</h3><p><b>Til '+esc(to)+'</b></p><p>'+esc(msg).replace(/\n/g,'<br>')+'</p><p><b>Fra '+esc(name)+'</b></p></div>'+
 '<p class="center"><button id="pr">Skriv ut julekortet</button> <button class="ghost" id="re">Spill på nytt</button></p>');
 $('#pr').onclick=()=>print();
 $('#re').onclick=()=>{stars=0;drawStars();cur=0;intro()};
}

drawStars();intro();
const L=$('#lights'),cols=['#ff6b6b','#ffd166','#7bdff2','#95d98a'];
for(let i=0;i<16;i++){const b=document.createElement('i');b.style.color=cols[i%4];b.style.animationDelay=(i*.4)+'s';L.appendChild(b)}
const cv=$('#snow'),cx=cv.getContext('2d');let W,H;const fl=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<80;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+.8,s:Math.random()*.6+.3,d:Math.random()*6});
function tick(t){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.8)';
 for(const f of fl){f.y+=f.s;f.x+=Math.sin(t/1500+f.d)*.3;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
 requestAnimationFrame(tick)}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(tick);
</script>
</body>
</html>
